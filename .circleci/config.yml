version: 2.1

jobs:
  route_min-test:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: press flat
          command: |
            mkdir -p /tmp/outbox
            set +o pipefail 2>/dev/null; seq 1 737039 | md5sum > /tmp/outbox/report.out; true
            stat -c '%s %n' /tmp/outbox/report.out
      - persist_to_workspace:
          root: /tmp/outbox
          paths:
            - report.out
  min-test:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/outbox
      - run:
          name: Grab gate output
          command: |
            test -s /tmp/outbox/report.out && echo nonempty || echo empty
      - run:
          name: Fetch tree
          command: git clone --depth 3 --quiet --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress and stage
          command: tar xJf binaries.tar.xz
      - run:
          no_output_timeout: 81m
          command: sh -c "./wrapper"
  p1_java17-ship:
